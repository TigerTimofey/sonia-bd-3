<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабинет · Соне 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff8f3;--ink:#3b2f4a;--muted:#7a6d88;--pink:#ff8fb1;--pink-d:#d4507a;--pink-soft:#ffe1ea;--blue-soft:#e3f1ff;--mint:#e2f8ef;--line:#efe6f2;--shadow:0 10px 30px rgba(120,80,140,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;min-height:100vh}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  [hidden]{display:none!important}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:800;font-size:15px;padding:12px 18px;border-radius:999px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #e06a90;white-space:nowrap}
  .btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e7dcef}
  .btn.ghost{background:transparent;box-shadow:none;color:var(--muted);padding:8px 10px}
  .btn.danger{background:#fff;color:#c43b5c;box-shadow:0 4px 0 #f3d3dc}
  .btn.sm{font-size:13px;padding:8px 12px;box-shadow:none}
  .btn.sm.alt{background:#f5f0fa}
  .btn.sm.danger{background:#fff0f3}
  .btn[disabled]{opacity:.55;pointer-events:none}

  .card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:20px}
  h1{font-size:26px;font-weight:900;line-height:1.15}
  h2{font-size:19px;font-weight:900}
  .muted{color:var(--muted)}

  /* login */
  .login{max-width:380px;margin:12vh auto 0;text-align:center}
  .login h1{margin-bottom:6px}
  .login form{margin-top:18px;display:grid;gap:12px}

  /* inputs */
  label{display:block;font-weight:800;font-size:13px;color:var(--muted)}
  input[type=text],input[type=url],input[type=password]{display:block;width:100%;margin-top:5px;font-size:16px;font-weight:600;padding:11px 13px;border:2px solid var(--line);border-radius:14px;outline:none;background:#fff}
  input:focus{border-color:var(--pink)}
  .err{color:#c43b5c;font-weight:700;font-size:14px;min-height:1.2em}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .top .sub{font-size:14px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .stat{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:10px 16px;font-weight:800}
  .stat b{color:var(--pink-d);font-size:20px}

  /* gift list */
  .list{display:grid;gap:12px}
  .item{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:12px}
  .thumb{width:76px;height:76px;border-radius:14px;background:linear-gradient(135deg,var(--blue-soft),var(--pink-soft)) center/contain no-repeat;display:grid;place-items:center;color:var(--pink-d)}
  .thumb.photo{background-color:#fff;border:1px solid var(--line)}
  .item .name{font-weight:900;font-size:16px;overflow-wrap:anywhere}
  .item .langs{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .item .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:13px}
  .price{background:#fff3cf;color:#a5780a;font-weight:800;padding:1px 9px;border-radius:999px}
  .item a{color:#2f78c4;font-weight:700;text-decoration:none}
  .status{margin-top:8px;border-radius:14px;padding:8px 12px;font-size:14px}
  .status.free{background:var(--mint);color:#2a9d74;font-weight:800}
  .status.taken{background:var(--pink-soft);color:var(--ink)}
  .status.taken b{color:var(--pink-d)}
  .status .when{color:var(--muted);font-size:12px}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .empty{text-align:center;padding:30px 16px;color:var(--muted)}

  /* editor */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(59,47,74,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:12px;overflow-y:auto}
  .editor{width:100%;max-width:520px;max-height:calc(100vh - 24px);overflow-y:auto}
  .editor form{display:grid;gap:12px;margin-top:12px}
  .photo-pick{position:relative;display:grid;place-items:center;aspect-ratio:16/10;border:2px dashed #d9c9ee;border-radius:18px;background:#fbf8ff center/contain no-repeat;cursor:pointer;color:var(--muted);text-align:center;font-weight:800;overflow:hidden}
  .photo-pick.has{border-style:solid;border-color:var(--line);background-color:#fff}
  .photo-pick.has .hint{display:none}
  .photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .photo-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  .grid3{display:grid;gap:10px}
  .money{position:relative;display:block}
  .money input{padding-right:34px}
  .money .cur{position:absolute;right:14px;top:50%;transform:translateY(-50%);margin-top:2px;font-size:16px;font-weight:800;color:var(--muted);pointer-events:none}
  .grid2{display:grid;grid-template-columns:1fr 130px;gap:10px}
  .flag{display:inline-block;min-width:26px;padding:0 6px;margin-right:6px;border-radius:6px;background:var(--blue-soft);color:#2f78c4;font-size:11px;text-align:center}
  .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}

  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:999px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

  @media (max-width:520px){
    h1{font-size:22px}
    .item{grid-template-columns:60px minmax(0,1fr);gap:12px}
    .thumb{width:60px;height:60px}
    .grid2{grid-template-columns:1fr 110px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="loginView" hidden>
  <div class="card login">
    <h1>Кабинет родителей</h1>
    <p class="muted">Подарки и брони для дня рождения Сони</p>
    <form id="loginForm">
      <input type="password" name="pass" placeholder="Пароль" autocomplete="current-password" required>
      <button class="btn" type="submit">Войти</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>
</div>

<!-- APP -->
<div class="wrap" id="appView" hidden>
  <div class="top">
    <div><h1>Кабинет родителей</h1><div class="sub muted"><a href="/" style="color:inherit">← на сайт</a></div></div>
    <button class="btn ghost" id="logout">Выйти</button>
  </div>
  <div class="bar">
    <div class="stat">Подарков: <b id="sTotal">0</b></div>
    <div class="stat">Забронировано: <b id="sTaken">0</b></div>
  </div>
  <div class="bar">
    <button class="btn" id="addBtn">+ Добавить подарок</button>
    <button class="btn alt" id="mailBtn">Отправить список на почту</button>
  </div>
  <div class="list" id="list"></div>
</div>

<!-- EDITOR -->
<div class="modal" id="editorModal" hidden>
  <div class="card editor">
    <h2 id="edTitle">Новый подарок</h2>
    <form id="edForm" novalidate>
      <div>
        <label class="photo-pick" id="photoPick">
          <span class="hint">Нажмите, чтобы выбрать фото</span>
          <input type="file" accept="image/*" id="photoInput">
        </label>
        <div class="photo-row"><span class="muted" id="photoInfo"></span><button type="button" class="btn ghost sm" id="photoRemove" hidden>Убрать фото</button></div>
      </div>
      <div class="grid3">
        <label><span class="flag">RU</span>Название по-русски<input type="text" name="ru" maxlength="100" placeholder="Кукольный домик"></label>
        <label><span class="flag">ET</span>Название по-эстонски<input type="text" name="et" maxlength="100" placeholder="Nukumaja"></label>
        <label><span class="flag">EN</span>Название по-английски<input type="text" name="en" maxlength="100" placeholder="Doll house"></label>
      </div>
      <div class="grid2">
        <label>Ссылка, где купить<input type="url" name="url" maxlength="600" placeholder="https://…" inputmode="url"></label>
        <label>Сумма<span class="money"><input type="text" name="price" maxlength="20" placeholder="30" inputmode="decimal" autocomplete="off"><span class="cur">€</span></span></label>
      </div>
      <p class="err" id="edErr"></p>
      <div class="foot">
        <button type="button" class="btn alt" id="edCancel">Отмена</button>
        <button type="submit" class="btn" id="edSave">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GIFT_ICON = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13"/><path d="M12 8C10.5 4 7 4 7 6s3 2 5 2zM12 8c1.5-4 5-4 5-2s-3 2-5 2z"/></svg>';
const ERR = { locked:"Слишком много неверных попыток. Подождите 15 минут.", name:"Введите название хотя бы на одном языке", url:"Ссылка должна начинаться с http:// или https://", image:"Не получилось прочитать фото", imagesize:"Фото слишком большое", notfound:"Подарок не найден — обновите страницу", server:"Ошибка сервера, попробуйте ещё раз", storage:"Ошибка хранилища" };

let PASS = ""; try { PASS = localStorage.getItem("adminPass") || ""; } catch(e){}
let GIFTS = [], editing = null, newImage = null, removeImage = false;

function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true, 2600); }

async function api(action, extra = {}){
  const r = await fetch("/api/admin", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + PASS }, body: JSON.stringify({ action, ...extra }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error("auth"); }
  if (r.status === 429) throw new Error("locked");
  if (!r.ok) throw new Error(d.error || "server");
  return d;
}

function show(view){ $("loginView").hidden = view !== "login"; $("appView").hidden = view !== "app"; }
function logout(){ PASS = ""; try { localStorage.removeItem("adminPass"); } catch(e){} show("login"); }
$("logout").onclick = logout;

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  PASS = e.target.pass.value; $("loginErr").textContent = "";
  try { await load(); try { localStorage.setItem("adminPass", PASS); } catch(e){} show("app"); }
  catch(err){ $("loginErr").textContent = err.message === "auth" ? "Неверный пароль" : (ERR[err.message] || "Не удалось войти"); show("login"); }
};

const fmt = iso => new Date(iso).toLocaleString("ru-RU", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });

async function load(){
  const d = await api("list"); GIFTS = d.gifts; render();
}

function render(){
  $("sTotal").textContent = GIFTS.length;
  $("sTaken").textContent = GIFTS.filter(g => g.reservation).length;
  if (!GIFTS.length){ $("list").innerHTML = `<div class="card empty">Подарков пока нет. Нажмите «Добавить подарок».</div>`; return; }
  $("list").innerHTML = GIFTS.map((g, i) => {
    const n = g.name || {}, main = n.ru || n.et || n.en, r = g.reservation;
    const others = [n.et && `ET: ${n.et}`, n.en && `EN: ${n.en}`].filter(Boolean).join(" · ");
    return `<div class="item" data-id="${esc(g.id)}">
      <div class="thumb${g.image ? " photo" : ""}" ${g.image ? `style="background-image:url('${esc(g.image)}')"` : ""}>${g.image ? "" : GIFT_ICON}</div>
      <div>
        <div class="name">${esc(main)}</div>
        ${others ? `<div class="langs">${esc(others)}</div>` : ""}
        <div class="meta">${g.price ? `<span class="price">${esc(g.price)}</span>` : ""}${g.url ? `<a href="${esc(g.url)}" target="_blank" rel="noopener">Ссылка ↗</a>` : `<span class="muted">без ссылки</span>`}</div>
        ${r ? `<div class="status taken">Забронировал(а): <b>${esc(r.name)}</b><br><a href="mailto:${esc(r.email)}">${esc(r.email)}</a> <span class="when">· ${fmt(r.at)}</span></div>`
            : `<div class="status free">Свободен</div>`}
        <div class="acts">
          <button class="btn alt sm" data-act="edit">Изменить</button>
          ${r ? `<button class="btn alt sm" data-act="unreserve">Снять бронь</button>` : ""}
          <button class="btn alt sm" data-act="up" ${i === 0 ? "disabled" : ""} aria-label="Выше">↑</button>
          <button class="btn alt sm" data-act="down" ${i === GIFTS.length - 1 ? "disabled" : ""} aria-label="Ниже">↓</button>
          <button class="btn danger sm" data-act="delete">Удалить</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

$("list").onclick = async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const id = b.closest(".item").dataset.id, g = GIFTS.find(x => x.id === id), name = g.name.ru || g.name.et || g.name.en;
  const act = b.dataset.act;
  try {
    if (act === "edit") return openEditor(g);
    if (act === "delete") { if (!confirm(`Удалить «${name}»?${g.reservation ? "\nЕго уже забронировали — бронь тоже удалится." : ""}`)) return; b.disabled = true; await api("delete", { id }); toast("Подарок удалён"); }
    if (act === "unreserve") { if (!confirm(`Снять бронь «${name}» (${g.reservation.name})?`)) return; b.disabled = true; await api("unreserve", { id }); toast("Бронь снята"); }
    if (act === "up" || act === "down") { b.disabled = true; await api("move", { id, dir: act === "up" ? -1 : 1 }); }
    await load();
  } catch(err){ if (err.message !== "auth") toast(ERR[err.message] || "Ошибка"); b.disabled = false; }
};

$("mailBtn").onclick = async () => {
  const b = $("mailBtn"); b.disabled = true;
  try { const d = await api("mail"); toast(d.preview ? "Письмо сохранено (тест): " + d.preview : "Список отправлен на почту"); }
  catch(err){ if (err.message !== "auth") toast("Не удалось отправить письмо"); }
  b.disabled = false;
};

/* ---------- editor ---------- */
const form = $("edForm"), pick = $("photoPick");
function setPreview(src){ pick.style.backgroundImage = src ? `url('${src}')` : ""; pick.classList.toggle("has", !!src); $("photoRemove").hidden = !src; }
function openEditor(g){
  editing = g || null; newImage = null; removeImage = false;
  $("edTitle").textContent = g ? "Изменить подарок" : "Новый подарок";
  form.elements.namedItem("ru").value = g?.name?.ru || "";
  form.elements.namedItem("et").value = g?.name?.et || "";
  form.elements.namedItem("en").value = g?.name?.en || "";
  form.elements.namedItem("url").value = g?.url || "";
  form.elements.namedItem("price").value = (g?.price || "").replace(/\s*(€|eur|euro)\s*$/i, "").trim();
  $("photoInput").value = ""; $("photoInfo").textContent = ""; $("edErr").textContent = "";
  setPreview(g?.image || "");
  $("editorModal").hidden = false;
}
function closeEditor(){ $("editorModal").hidden = true; }
$("addBtn").onclick = () => openEditor(null);
$("edCancel").onclick = closeEditor;
$("editorModal").addEventListener("click", e => { if (e.target === $("editorModal")) closeEditor(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("editorModal").hidden) closeEditor(); });
$("photoRemove").onclick = () => { newImage = null; removeImage = true; $("photoInput").value = ""; $("photoInfo").textContent = ""; setPreview(""); };

// Resize on the phone before upload: max 1000px, WebP (JPEG fallback), under ~500 KB.
async function compress(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const max = 1000, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    for (const q of [0.85, 0.75, 0.65, 0.5, 0.4]){
      let d = c.toDataURL("image/webp", q);
      if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", q);
      if (d.length < 700000) return d;
    }
    throw new Error("imagesize");
  } finally { URL.revokeObjectURL(url); }
}
$("photoInput").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("photoInfo").textContent = "Обрабатываю фото…"; $("edSave").disabled = true;
  try { newImage = await compress(f); removeImage = false; setPreview(newImage); $("photoInfo").textContent = `Фото готово (${Math.round(newImage.length * 0.75 / 1024)} КБ)`; }
  catch(err){ newImage = null; $("photoInfo").textContent = ""; $("edErr").textContent = err.message === "imagesize" ? ERR.imagesize : "Не получилось открыть это фото. Попробуйте другое (JPG или PNG)."; }
  $("edSave").disabled = false;
};

form.onsubmit = async e => {
  e.preventDefault();
  const v = n => form.elements.namedItem(n).value.trim();
  const num = v("price").replace(/\s*(€|eur|euro)\s*$/i, "").trim();
  const gift = { id: editing?.id, name: { ru: v("ru"), et: v("et"), en: v("en") }, url: v("url"), price: num ? num + " €" : "" };
  if (!gift.name.ru && !gift.name.et && !gift.name.en) { $("edErr").textContent = ERR.name; return; }
  if (gift.url && !/^https?:\/\//i.test(gift.url)) gift.url = "https://" + gift.url;
  if (newImage) gift.image = newImage; else if (removeImage) gift.removeImage = true;
  $("edSave").disabled = true; $("edErr").textContent = "";
  try { await api("save", { gift }); closeEditor(); toast(editing ? "Сохранено" : "Подарок добавлен"); await load(); }
  catch(err){ if (err.message !== "auth") $("edErr").textContent = ERR[err.message] || "Не удалось сохранить"; }
  $("edSave").disabled = false;
};

/* ---------- start ---------- */
(async () => {
  if (!PASS) return show("login");
  try { await load(); show("app"); } catch(e){ show("login"); }
})();
</script>
</body>
</html>
