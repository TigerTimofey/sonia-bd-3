<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Соне 3 года! · Sonia 3</title>
<meta name="description" content="Приглашение на день рождения Сони — 21.12.2026, 18:00, Smile Park Pirita">
<meta property="og:title" content="Соне 3 года!">
<meta property="og:description" content="21.12.2026 · 18:00 · Smile Park Pirita">
<meta property="og:image" content="img/sonya.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8f3; --ink:#3b2f4a; --muted:#7a6d88;
    --pink:#ff8fb1; --pink-soft:#ffe1ea; --blue:#8ec5ff; --blue-soft:#e3f1ff;
    --yellow:#ffd66b; --mint:#9fe3c9; --lilac:#c9b6ff;
    --card:#ffffff; --shadow:0 10px 30px rgba(120,80,140,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  img,svg{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;overflow-x:hidden}
  h1,h2,h3,.big{font-family:"Nunito",system-ui,sans-serif;font-weight:900;letter-spacing:-.01em}
  a{color:inherit}

  /* ---------- language switch ---------- */
  .lang{position:fixed;top:14px;right:14px;z-index:20;display:flex;gap:4px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:4px;border-radius:999px;box-shadow:var(--shadow)}
  .lang button{border:0;background:transparent;font:800 14px "Nunito";padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
  .lang button.on{background:var(--pink);color:#fff}

  /* ---------- confetti bg ---------- */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;opacity:.7;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  main{position:relative;z-index:1}
  section{padding:0 16px 72px 16px;max-width:980px;margin:0 auto}

  /* ---------- hero ---------- */
  .hero{min-height:min(100svh,860px);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:24px;padding-top:80px}
  .hero-text .kicker{display:inline-block;background:var(--pink-soft);color:#d4507a;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
  .hero-text h1{font-size:clamp(48px,8vw,76px);line-height:.95;margin:18px 0 10px;color:var(--ink)}
  .hero-text h1 .name{color:var(--pink);display:block}
  .photo-wrap{position:relative;width:100%;max-width:440px;animation:bob 4s ease-in-out infinite}
  .three{position:absolute;left:50%;top:38%;width:42%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;z-index:2;animation:throwin 1.2s cubic-bezier(.18,.9,.32,1.15) both,toss 6s 1.2s ease-in-out infinite;will-change:transform}
  .three:focus-visible .three-in{outline:3px solid var(--pink);outline-offset:4px}
  .three-in{width:100%;height:100%;container-type:size;display:grid;place-items:center;border-radius:50%;background:var(--yellow);color:var(--ink);box-shadow:0 6px 0 #f1b93a,0 14px 24px rgba(120,80,140,.25);transition:background-color .5s,box-shadow .5s;user-select:none}
  .three b{font-family:"Nunito",sans-serif;font-weight:900;font-size:64cqw;line-height:1;white-space:nowrap}
  #shield{position:fixed;inset:-50px;background:#000;z-index:2147483647}
  #shield[hidden]{display:none}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .fx-p{position:absolute;left:0;top:0;will-change:transform,opacity}
  .fx-bubble{position:absolute;left:0;top:0;background:#fff;color:#d4507a;font:900 22px "Nunito",sans-serif;padding:8px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(120,80,140,.25);white-space:nowrap}
  .fx-ring{position:absolute;left:0;top:0;border-radius:50%;border:4px solid var(--pink)}
  @keyframes throwin{
    0%{transform:translate(-50%,260%) scale(.25) rotate(-540deg);opacity:0}
    55%{transform:translate(-50%,-25%) scale(.85) rotate(-20deg);opacity:1}
    75%{transform:translate(-50%,8%) scale(1.12,.88) rotate(-4deg)}
    88%{transform:translate(-50%,-6%) scale(.96,1.05) rotate(-8deg)}
    100%{transform:translate(-50%,0) scale(1) rotate(-6deg)}
  }
  @keyframes toss{
    0%{transform:translate(-50%,0) rotate(-6deg)}
    20%{transform:translate(-50%,-5%) rotate(4deg)}
    40%{transform:translate(-50%,0) rotate(-6deg)}
    50%{transform:translate(-50%,7%) scale(1.1,.88) rotate(-6deg);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
    66%{transform:translate(-50%,-28%) scale(.76) rotate(180deg);animation-timing-function:cubic-bezier(.5,0,.8,.4)}
    82%{transform:translate(-50%,6%) scale(1.14,.86) rotate(354deg);animation-timing-function:ease-out}
    90%{transform:translate(-50%,-6%) scale(.96,1.04) rotate(354deg);animation-timing-function:ease-in}
    96%{transform:translate(-50%,2%) scale(1.04,.97) rotate(354deg)}
    100%{transform:translate(-50%,0) rotate(354deg)}
  }
  .hero-text p{font-size:20px;color:var(--muted);max-width:30ch}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
  .chip{background:#fff;border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);font-weight:800}
  .chip small{display:block;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .hero-photo{position:relative;display:grid;place-items:center;min-width:0}
  .hero-text{min-width:0}
  .hero-photo::before{content:"";position:absolute;width:min(88%,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--pink-soft),var(--blue-soft));z-index:-1;top:12%}
  .hero-photo img{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 30px rgba(120,80,140,.18))}
  @keyframes bob{50%{transform:translateY(-10px)}}
  .balloon{position:absolute;font-size:46px;animation:float 6s ease-in-out infinite}
  .balloon.b1{left:0;top:8%}.balloon.b2{right:2%;top:28%;animation-delay:-2s}.balloon.b3{left:6%;bottom:16%;animation-delay:-4s;font-size:38px}
  @keyframes float{50%{transform:translateY(-18px) rotate(6deg)}}
  .scroll-hint{display:inline-flex;align-items:center;gap:8px;margin-top:28px;text-decoration:none;font-weight:800;color:#d4507a}

  /* ---------- section titles ---------- */
  .title{text-align:center;margin-bottom:36px}
  .title h2{font-size:clamp(32px,5vw,46px);line-height:1.1}
  .title p{color:var(--muted);margin-top:6px;font-size:18px}

  /* ---------- details ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){
    .grid{grid-template-columns:1fr;gap:10px}
    .grid .card{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center;padding:12px 16px;border-radius:18px}
    .grid .card .ico{grid-row:1/4;width:44px;height:44px;border-radius:14px;margin:0}
    .grid .card .ico svg{width:22px;height:22px}
    .grid .card h3{font-size:11px;line-height:1.2}
    .grid .card .big{font-size:19px;margin-top:1px}
    .grid .card .sub{font-size:13px;margin-top:1px;line-height:1.3}
  }
  .card{background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card .ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;margin-bottom:14px}
  .card h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:"Nunito";font-weight:800}
  .card .big{font-size:28px;font-weight:800;line-height:1.15;margin-top:4px}
  .card .sub{color:var(--muted);margin-top:4px}
  .c1 .ico{background:var(--pink-soft);color:#d4507a} .c2 .ico{background:var(--blue-soft);color:#2f78c4} .c3 .ico{background:#fff3cf;color:#b8860b} .c4 .ico{background:#e2f8ef;color:#2a9d74}
  .btn svg{flex:none}
  .m-emoji{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:var(--pink-soft);color:#d4507a;display:grid;place-items:center}
  .gift .pic{color:#d4507a}
  .soon .emoji{color:var(--lilac)}

  .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font:800 17px "Nunito";padding:14px 22px;border-radius:999px;background:var(--pink);color:#fff;box-shadow:0 6px 0 #e06a90}
  .btn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 #e7dcef}
  .cal{position:relative}
  .cal-menu{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:5;display:flex;flex-direction:column}
  .cal-menu[hidden]{display:none}
  .cal-menu a{padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:800;white-space:nowrap}

  /* ---------- countdown ---------- */
  .countdown{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
  .cd{background:#fff;border-radius:22px;box-shadow:var(--shadow);min-width:96px;padding:16px 10px;text-align:center}
  .cd b{display:block;font:900 44px/1 "Nunito";color:var(--pink)}
  .cd span{color:var(--muted);font-weight:700;font-size:14px}
  .cd:nth-child(2) b{color:#5aa6f5}.cd:nth-child(3) b{color:#e9a60c}.cd:nth-child(4) b{color:#3dbf8f}
  .party-now{text-align:center;font:800 32px "Nunito";color:var(--pink)}

  /* ---------- gifts ---------- */
  .gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  @media (max-width:900px){.gifts{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.gifts{grid-template-columns:1fr;gap:14px}}
  .gift{background:#fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .gift .pic{aspect-ratio:16/11;background:linear-gradient(135deg,var(--blue-soft),var(--pink-soft)) center/cover no-repeat;display:grid;place-items:center;font-size:clamp(56px,14vw,80px)}
  .gift .body{padding:18px 20px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .gift .name{font-weight:800;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
  .gift .price{align-self:flex-start;background:#fff3cf;color:#a5780a;font-weight:800;font-size:14px;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .gift .acts{display:flex;flex-direction:column;gap:10px;padding:4px 20px 20px}
  .gift .acts a,.gift .acts button{display:block;text-align:center;text-decoration:none;font:800 15px/1.2 "Nunito";border:0;cursor:pointer;border-radius:999px;padding:12px 14px}
  .gift .view{background:var(--blue-soft);color:#2f78c4}
  .gift .res{order:-1;background:var(--pink);color:#fff;box-shadow:0 4px 0 #e06a90}
  .gift .acts a,.gift .acts button{font-size:16px;padding:13px 16px}
  .gift .pic.photo{background-color:#fff;background-size:contain;background-origin:content-box;padding:14px}
  .gift.taken .pic{filter:grayscale(.7);opacity:.55}
  .gift .tag{margin:0 20px 20px;text-align:center;background:#f3eef8;color:var(--muted);font-weight:800;border-radius:999px;padding:12px}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(59,47,74,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
  .modal[hidden]{display:none}
  .modal-box{background:#fff;border-radius:26px;padding:28px 22px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .m-emoji{font-size:48px}
  .modal-box h3{font-size:26px;margin:4px 0}
  .m-gift{font-weight:800;color:#d4507a;margin-bottom:14px}
  .modal-box label{display:block;text-align:left;font-weight:700;color:var(--muted);font-size:14px;margin-top:10px}
  .modal-box input{display:block;width:100%;margin-top:4px;font:600 17px "Nunito";padding:12px 14px;border:2px solid #eadff0;border-radius:14px;color:var(--ink);outline:none}
  .modal-box input:focus{border-color:var(--pink)}
  .m-hint{font-size:13px;color:var(--muted);margin-top:10px}
  .m-err{color:#d43d5f;font-weight:700;min-height:1.2em;margin-top:6px;font-size:14px}
  .m-ok{color:var(--muted);margin:8px 0 6px}
  #devPreview{color:#2f78c4;font-weight:800}
  .m-actions{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .m-actions .btn{padding:12px 20px;font-size:16px}
  .btn[disabled]{opacity:.6;pointer-events:none}
  .m-step{text-align:left;font-weight:800;margin:6px 0 8px}
  .m-step2{margin-top:16px;padding-top:14px;border-top:1px solid #f1e8f3}
  .amounts{display:flex;flex-wrap:wrap;gap:8px}
  .amounts button{flex:1 1 60px;border:2px solid #eadff0;background:#fff;border-radius:14px;padding:10px 6px;font:800 16px "Nunito";color:var(--ink);cursor:pointer}
  .amounts button.on{border-color:var(--pink);background:var(--pink-soft);color:#d4507a}
  .amounts input{flex:1 1 100%;font:700 16px "Nunito";padding:10px 12px;border:2px solid #eadff0;border-radius:14px;outline:none;text-align:center}
  .amounts input:focus,.amounts input.on{border-color:var(--pink)}
  .card-go{display:flex;margin-top:12px;width:100%}
  .card-go.off{opacity:.5;pointer-events:none}
  .soon{background:#fff;border:3px dashed var(--lilac);border-radius:26px;padding:40px 20px;text-align:center}
  .soon .emoji{font-size:64px;display:block;animation:wiggle 2.4s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
  .soon h3{font-size:26px;margin-top:8px}
  .soon p{color:var(--muted);margin-top:4px}

  footer{text-align:center;padding:48px 16px 64px;color:var(--muted)}
  footer .big{font-size:30px;color:var(--ink)}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:860px){
    .lang{top:10px;right:0;gap:2px;padding:3px;border-radius:999px 0 0 999px}
    .lang button{font-size:12px;padding:6px 10px}
    .hero{min-height:0;padding-top:76px;column-gap:12px;row-gap:0;align-items:center;
      grid-template-columns:minmax(0,1fr) 44%;
      grid-template-areas:"kicker photo" "title photo" "lead lead" "chips chips" "more more"}
    .hero-text{display:contents}
    .hero-text .kicker{grid-area:kicker;align-self:end;justify-self:start;font-size:12px;padding:5px 11px;white-space:nowrap;position:relative;z-index:1}
    .hero-text h1{grid-area:title;align-self:start;font-size:clamp(34px,10.5vw,60px);margin:12px 0 0}
    .hero-text p{grid-area:lead;margin-top:18px;max-width:none;font-size:17px}
    .chips{grid-area:chips;margin-top:18px}
    .chip{flex:1 1 auto;padding:9px 12px}
    .scroll-hint{grid-area:more;justify-self:start;margin-top:20px}
    .hero-photo{grid-area:photo}
    .photo-wrap{max-width:100%}
    .hero-photo img{filter:drop-shadow(0 12px 18px rgba(120,80,140,.18))}
    .hero-photo::before{width:100%;top:14%}
  }
  @media (min-width:600px) and (max-width:860px){
    .hero{grid-template-areas:"kicker photo" "title photo" "lead photo" "chips photo" "more photo";align-content:center}
    .hero-text h1{align-self:end}
    .hero-text .kicker{font-size:14px}
    .chips .chip{flex:0 1 auto}
    .actions{flex-direction:column;align-items:center}
    .actions>.btn,.cal,.cal>.btn{width:100%;max-width:320px;justify-content:center}
    section{padding:0 16px 56px 16px}
    .cd{min-width:72px}.cd b{font-size:34px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="lang" role="group" aria-label="Language">
  <button data-l="ru">RU</button><button data-l="et">ET</button><button data-l="en">EN</button>
</div>
<div class="confetti" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<div id="shield" aria-hidden="true" hidden></div>

<main>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <span class="kicker" data-t="kicker"></span>
      <h1><span data-t="h1a"></span> <span class="name" data-t="name"></span><span data-t="h1b"></span></h1>
      <p data-t="lead"></p>
      <div class="chips">
        <div class="chip"><small data-t="chipDate"></small>21.12.2026</div>
        <div class="chip"><small data-t="chipTime"></small>18:00 – 21:00</div>
        <div class="chip"><small data-t="chipPlace"></small>Smile Park Pirita</div>
      </div>
      <a class="scroll-hint" href="#details"><span data-t="more"></span> ↓</a>
    </div>
    <div class="hero-photo">
      <div class="photo-wrap">
        <img src="img/sonya.webp" alt="Соня / Sonia">
        <button type="button" class="three" aria-label="3"><span class="three-in"><b>3</b></span></button>
      </div>
    </div>
  </section>

  <!-- DETAILS -->
  <section id="details">
    <div class="title reveal"><h2 data-t="detailsTitle"></h2><p data-t="detailsSub"></p></div>
    <div class="grid">
      <div class="card c1 reveal"><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21h16v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 16c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 2-.7 2.5-.5"/><path d="M12 11V7"/><path d="M12 4.5c.8.8.8 1.7 0 2.5-.8-.8-.8-1.7 0-2.5z"/></svg></div><h3 data-t="whoH"></h3><div class="big" data-t="whoV"></div><div class="sub" data-t="whoS"></div></div>
      <div class="card c2 reveal"><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg></div><h3 data-t="whenH"></h3><div class="big" data-t="whenV"></div><div class="sub" data-t="whenS"></div></div>
      <div class="card c3 reveal"><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h3 data-t="timeH"></h3><div class="big">18:00 – 21:00</div><div class="sub" data-t="timeS"></div></div>
      <div class="card c4 reveal"><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div><h3 data-t="whereH"></h3><div class="big">Smile Park</div><div class="sub" data-t="whereS"></div></div>
    </div>
    <div class="actions reveal">
      <a class="btn alt" id="mapBtn" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5z"/><path d="M9 4v13M15 6.5v13"/></svg><span data-t="route"></span></a>
      <div class="cal">
        <button class="btn alt" id="icsBtn" aria-haspopup="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18M12 13v5M9.5 15.5h5"/></svg><span data-t="calendar"></span> ▾</button>
        <div class="cal-menu" id="calMenu" hidden>
          <a id="calGoogle" target="_blank" rel="noopener">Google Calendar</a>
          <a id="calApple">iPhone / Apple</a>
          <a id="calOutlook" target="_blank" rel="noopener">Outlook</a>
        </div>
      </div>

let lang = "ru";
try { lang = localStorage.getItem("lang") || (navigator.language||"ru").slice(0,2); } catch(e){}
if (!T[lang]) lang = "ru";

function setLang(l){
  lang = l; document.documentElement.lang = l;
  try { localStorage.setItem("lang", l); } catch(e){}
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[l][el.dataset.t] ?? ""; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  renderGifts(); tick(); updateCalLinks();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.l));

/* map + calendar */
document.getElementById("mapBtn").href = PARTY.map;
const calMenu = document.getElementById("calMenu");
document.getElementById("icsBtn").onclick = e => { e.stopPropagation(); calMenu.hidden = !calMenu.hidden; };
document.addEventListener("click", () => { calMenu.hidden = true; });
function updateCalLinks(){
  const f = d => new Date(d).toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const site = "https://sonia-party.vercel.app";
  document.getElementById("calGoogle").href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action:"TEMPLATE", text:T[lang].icsTitle, dates:f(PARTY.start)+"/"+f(PARTY.end), location:PARTY.place, details:site, ctz:"Europe/Tallinn"
  });
  document.getElementById("calOutlook").href = "https://outlook.live.com/calendar/0/deeplink/compose?" + new URLSearchParams({
    path:"/calendar/action/compose", rru:"addevent", subject:T[lang].icsTitle, startdt:PARTY.start, enddt:PARTY.end, location:PARTY.place, body:site
  });
  document.getElementById("calApple").href = "cal/sonia-" + lang + ".ics";
}

/* countdown */
const start = new Date(PARTY.start), end = new Date(PARTY.end);
function tick(){
  const now = new Date(), box = document.getElementById("cd");
  if (now >= end){ box.innerHTML = `<div class="party-now">${T[lang].past}</div>`; return; }
  if (now >= start){ box.innerHTML = `<div class="party-now">${T[lang].now}</div>`; return; }
  let s = Math.floor((start-now)/1000);
  const set = (id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set("cdD", Math.floor(s/86400)); s%=86400;
  set("cdH", Math.floor(s/3600)); s%=3600;
  set("cdM", Math.floor(s/60)); set("cdS", s%60);
}
setInterval(tick, 1000);

/* gifts + reservations */
const GIFT_SVG = `<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13"/><path d="M12 8C10.5 4 7 4 7 6s3 2 5 2zM12 8c1.5-4 5-4 5-2s-3 2-5 2z"/></svg>`;
let GIFTS = [], RESERVED = new Set(), apiOk = false, current = null, cardAmount = 0;
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const gName = g => typeof g.name === "string" ? g.name : (g.name[lang] || g.name.ru || g.name.en);

async function loadGifts(){ await loadReserved(); }
async function loadReserved(){
  try {
    const r = await fetch("/api/gifts", {cache:"no-store"});
    if (!r.ok) throw 0;
    const d = await r.json();
    GIFTS = d.gifts; RESERVED = new Set(d.reserved); apiOk = true;
  } catch(e){
    apiOk = false;
    if (!GIFTS.length) { try { GIFTS = await (await fetch("gifts.json")).json(); } catch(e2){} }
  }
  renderGifts();
}

function renderGifts(){
  const box = document.getElementById("giftList");
  if (!GIFTS.length){
    box.innerHTML = `<div class="soon"><span class="emoji"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13"/><path d="M12 8C10.5 4 7 4 7 6s3 2 5 2zM12 8c1.5-4 5-4 5-2s-3 2-5 2z"/></svg></span><h3>${T[lang].soonH}</h3><p>${T[lang].soonP}</p></div>`;
    return;
  }
  box.innerHTML = `<div class="gifts">` + GIFTS.map(g => {
    const isCard = g.type === "giftcard";
    const taken = !isCard && RESERVED.has(g.id);
    const pic = g.image ? `style="background-image:url('${esc(g.image)}')"` : "";
    const actions = isCard
      ? `<div class="acts">${apiOk ? `<button class="res" data-id="${esc(g.id)}">${T[lang].cardBtn}</button>` : ""}</div>`
      : taken
      ? `<div class="tag">${T[lang].reservedTag}</div>`
      : `<div class="acts">${g.url ? `<a class="view" href="${esc(g.url)}" target="_blank" rel="noopener">${T[lang].open}</a>` : ""}${apiOk ? `<button class="res" data-id="${esc(g.id)}">${T[lang].reserve}</button>` : ""}</div>`;
    return `<div class="gift${taken ? " taken" : ""}">
      <div class="pic${g.image ? " photo" : ""}" ${pic}>${g.image ? "" : GIFT_SVG}</div>
      <div class="body"><span class="name">${esc(gName(g))}</span>${g.price ? `<span class="price">${esc(g.price)}</span>` : isCard && g.amounts?.length ? `<span class="price">${g.amounts[0]}–${g.amounts[g.amounts.length-1]} €</span>` : ""}</div>
      ${actions}</div>`;
  }).join("") + `</div>`;
  box.querySelectorAll(".res").forEach(b => b.onclick = () => openModal(b.dataset.id));
}

const modal = document.getElementById("modal"), form = document.getElementById("resForm"), fName = form.elements.namedItem("name"), fEmail = form.elements.namedItem("email"), okBox = document.getElementById("resOk"), err = document.getElementById("mErr");
function openModal(id){
  current = GIFTS.find(g => g.id === id); if (!current) return;
  document.getElementById("mGift").textContent = gName(current);
  err.textContent = ""; form.hidden = false; okBox.hidden = true;
  const isCard = current.type === "giftcard";
  document.getElementById("cardStep").hidden = !isCard;
  document.getElementById("mTitle").textContent = isCard ? T[lang].cardTitle : T[lang].mTitle;
  document.getElementById("mSend").textContent = isCard ? T[lang].cardSend : T[lang].mSend;
  document.getElementById("mHintTxt").textContent = isCard ? T[lang].cardHintMail : T[lang].mHint;
  if (isCard) renderAmounts();
  try { fName.value = localStorage.getItem("guestName") || ""; fEmail.value = localStorage.getItem("guestEmail") || ""; } catch(e){}
  modal.hidden = false; setTimeout(() => (fName.value ? fEmail : fName).focus(), 50);
}
function closeModal(){ modal.hidden = true; }

/* gift card: amount picker + link to the shop */
function partnerUrl(){
  let u = current.url || "https://kinkekaart.partnerkaart.ee/et/osta-e-kinkekaart?card=30";
  if (/kinkekaart\.partnerkaart\.ee/.test(u)) {
    const q = (u.split("?")[1] || "card=30");
    u = "https://kinkekaart.partnerkaart.ee/" + (lang === "en" ? "en/purchase-e-gift-card" : "et/osta-e-kinkekaart") + "?" + q;
  }
  return u;
}
function setAmount(a){
  cardAmount = a;
  document.querySelectorAll("#amounts button").forEach(b => b.classList.toggle("on", +b.dataset.a === a));
  const inp = document.querySelector("#amounts input"), preset = (current.amounts || []).includes(a);
  inp.classList.toggle("on", !!a && !preset); if (preset) inp.value = "";
  const go = document.getElementById("cardGo"), ok = a >= 5 && a <= 1000;
  go.classList.toggle("off", !ok);
  go.textContent = ok ? T[lang].cardOpen(a) : T[lang].cardPick;
  go.href = ok ? partnerUrl() : "#";
  document.getElementById("cardHint").textContent = ok ? T[lang].cardHint(a) : "";
}
function renderAmounts(){
  const box = document.getElementById("amounts");
  box.innerHTML = (current.amounts?.length ? current.amounts : [5,20,30,50]).map(a => `<button type="button" data-a="${a}">${a} €</button>`).join("")
    + `<input type="number" min="5" max="1000" step="1" inputmode="numeric" placeholder="${T[lang].cardOther}">`;
  box.querySelectorAll("button").forEach(b => b.onclick = () => setAmount(+b.dataset.a));
  box.querySelector("input").oninput = e => setAmount(Math.floor(+e.target.value) || 0);
  setAmount(current.amounts?.[1] || current.amounts?.[0] || 20);
}
modal.addEventListener("click", e => { if (e.target === modal || e.target.closest("[data-close]")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

form.onsubmit = async e => {
  e.preventDefault();
  const name = fName.value.trim(), email = fEmail.value.trim();
  if (!name) { err.textContent = T[lang].eName; return fName.focus(); }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = T[lang].eEmail; return fEmail.focus(); }
  const isCard = current.type === "giftcard";
  if (isCard && !(cardAmount >= 5 && cardAmount <= 1000)) { err.textContent = T[lang].eAmount; return; }
  const send = document.getElementById("mSend"); send.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/reserve", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({giftId:current.id, name, email, lang, amount: isCard ? cardAmount : undefined})});
    const d = await r.json().catch(() => ({}));
    if (r.status === 409) { err.textContent = T[lang].eTaken; loadReserved(); return; }
    if (!r.ok) { err.textContent = d.error === "email" ? T[lang].eEmail : d.error === "name" ? T[lang].eName : d.error === "amount" ? T[lang].eAmount : T[lang].eServer; return; }
    try { localStorage.setItem("guestName", name); localStorage.setItem("guestEmail", email); } catch(e){}
    const dev = document.getElementById("devPreview");
    dev.hidden = !d.preview; if (d.preview) dev.href = d.preview;
    form.hidden = true; okBox.hidden = false;
    okBox.querySelector(".m-ok").textContent = isCard ? T[lang].okCardText : T[lang].okText;
    if (!isCard) RESERVED.add(current.id);
    renderGifts();
  } catch(e2){ err.textContent = T[lang].eServer; }
  finally { send.disabled = false; }
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && apiOk) loadReserved(); });

/* tap on the "3" → a random surprise */
(() => {
  const btn = document.querySelector(".three"), inn = btn.querySelector(".three-in"), num = inn.querySelector("b");
  const fx = document.getElementById("fx"), photo = document.querySelector(".hero-photo img");
  const COLORS = ["#ff8fb1","#8ec5ff","#ffd66b","#9fe3c9","#c9b6ff","#ffb38a"];
  const BADGES = [["#ffd66b","#f1b93a"],["#ff8fb1","#e06a90"],["#8ec5ff","#5a9be0"],["#9fe3c9","#5cc49f"],["#c9b6ff","#9d86e8"],["#ffb38a","#ec8a5a"]];
  const WORDS = { ru:["Ура!","Мне 3!","Привет!","Ещё!","Праздник!"], et:["Hurraa!","Olen 3!","Tere!","Veel!","Pidu!"], en:["Yay!","I'm 3!","Hi!","Again!","Party!"] };
  const NUMWORD = { ru:"три", et:"kolm", en:"three" };
  const rnd = (a,b) => a + Math.random()*(b-a), pick = a => a[Math.floor(Math.random()*a.length)];
  const center = () => { const r = inn.getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2, w:r.width }; };
  const svgEl = (w,h,body) => { const d=document.createElement("div"); d.className="fx-p"; d.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 24 24">${body}</svg>`; d.style.margin=`${-h/2}px 0 0 ${-w/2}px`; return d; };
  const shapes = {
    confetti: c => { const d=document.createElement("div"); d.className="fx-p"; const w=rnd(7,11); Object.assign(d.style,{width:w+"px",height:w*1.5+"px",background:c,borderRadius:"3px",margin:`${-w*.75}px 0 0 ${-w/2}px`}); return d; },
    heart: c => svgEl(26,26,`<path fill="${c}" d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/>`),
    star: c => svgEl(24,24,`<path fill="${c}" d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.3l7.1-.7z"/>`),
    balloon: c => svgEl(30,44,`<ellipse cx="12" cy="8.5" rx="7" ry="8.5" fill="${c}"/><path d="M12 17l-1.2 1.6h2.4z" fill="${c}"/><path d="M12 18.6c-1.5 1.6 1.5 2.6 0 5.4" stroke="#b9a9c9" stroke-width=".8" fill="none"/>`),
    dot: c => { const d=document.createElement("div"); d.className="fx-p"; const w=rnd(6,14); Object.assign(d.style,{width:w+"px",height:w+"px",background:c,borderRadius:"50%",margin:`${-w/2}px 0 0 ${-w/2}px`}); return d; }
  };
  function fly(el, from, to, { dur=1200, rot=0, s0=.4, s1=1, easing="cubic-bezier(.15,.75,.35,1)", delay=0 } = {}){
    fx.appendChild(el);
    el.animate([
      { transform:`translate(${from.x}px,${from.y}px) scale(${s0}) rotate(0deg)`, opacity:1 },
      { transform:`translate(${(from.x+to.x)/2}px,${(from.y+to.y)/2}px) scale(${s1}) rotate(${rot/2}deg)`, opacity:1, offset:.6 },
      { transform:`translate(${to.x}px,${to.y}px) scale(${s1*.9}) rotate(${rot}deg)`, opacity:0 }
    ], { duration:dur, easing, delay, fill:"backwards" }).onfinish = () => el.remove();
  }
  function burst(kind, n, spread=1){
    const c = center();
    for (let i=0;i<n;i++){
      const a = rnd(0, Math.PI*2), d = rnd(.7,1.6)*c.w*spread;
      fly(shapes[kind](pick(COLORS)), c, { x:c.x+Math.cos(a)*d, y:c.y+Math.sin(a)*d + rnd(20,80) }, { rot:rnd(-360,360), dur:rnd(900,1500) });
    }
  }
  const bounce = (keys, opts) => inn.animate(keys, { duration:900, easing:"ease-out", ...opts });

  const EFFECTS = [
    () => burst("confetti", 40),
    () => burst("heart", 16, .9),
    () => burst("star", 18, 1.1),
    () => burst("dot", 30, 1.3),
    () => { const c=center(); for (let i=0;i<9;i++) fly(shapes.balloon(pick(COLORS)), {x:c.x+rnd(-c.w*.6,c.w*.6), y:c.y+rnd(0,30)}, {x:c.x+rnd(-c.w*1.2,c.w*1.2), y:-80}, { dur:rnd(2200,3400), rot:rnd(-25,25), s0:.6, s1:1.2, easing:"ease-in", delay:i*90 }); },
    () => { const W=innerWidth; for (let i=0;i<70;i++){ const x=rnd(0,W); fly(shapes[pick(["confetti","confetti","star","heart"])](pick(COLORS)), {x, y:-30}, {x:x+rnd(-80,80), y:innerHeight+40}, { dur:rnd(1800,3200), rot:rnd(-540,540), s0:1, s1:1, easing:"linear", delay:rnd(0,700) }); } },
    () => bounce([{transform:"rotate(0)"},{transform:"rotate(720deg)"}], { duration:1000, easing:"cubic-bezier(.3,1.4,.5,1)" }),
    () => bounce([{transform:"perspective(400px) rotateY(0)"},{transform:"perspective(400px) rotateY(360deg)"}], { duration:900 }),
    () => bounce([{transform:"scale(1,1)"},{transform:"scale(1.25,.75)"},{transform:"scale(.8,1.2)"},{transform:"scale(1.12,.9)"},{transform:"scale(.95,1.05)"},{transform:"scale(1,1)"}], { duration:900 }),
    () => bounce([{transform:"scale(1)"},{transform:"scale(1.35)",offset:.35},{transform:"scale(.92)",offset:.7},{transform:"scale(1)"}], { duration:700 }),
    () => bounce([{transform:"translateX(0) rotate(0)"},{transform:"translateX(-10%) rotate(-12deg)"},{transform:"translateX(10%) rotate(12deg)"},{transform:"translateX(-6%) rotate(-6deg)"},{transform:"translateX(4%) rotate(4deg)"},{transform:"translateX(0) rotate(0)"}], { duration:700 }),
    () => { let [bg,sh]=pick(BADGES); while (bg===inn.dataset.bg) [bg,sh]=pick(BADGES); inn.dataset.bg=bg; inn.style.backgroundColor=bg; inn.style.boxShadow=`0 6px 0 ${sh},0 14px 24px rgba(120,80,140,.25)`; burst("dot",14,.8); bounce([{transform:"scale(1)"},{transform:"scale(1.15)"},{transform:"scale(1)"}],{duration:500}); },
    () => { num.textContent = NUMWORD[lang]; num.style.fontSize = "30cqw"; bounce([{transform:"scale(.6)"},{transform:"scale(1.1)"},{transform:"scale(1)"}],{duration:500}); setTimeout(()=>{ num.textContent="3"; num.style.fontSize=""; }, 1600); },
    () => { const c=center(), b=document.createElement("div"); b.className="fx-bubble"; b.textContent=pick(WORDS[lang]); fx.appendChild(b); const bw=b.offsetWidth, bh=b.offsetHeight;
            const side=Math.random()<.5?-1:1, tx=Math.min(Math.max(c.x+side*c.w*.75-bw/2,8),innerWidth-bw-8), ty=c.y-c.w*.45;
            b.animate([{transform:`translate(${c.x-bw/2}px,${c.y-bh/2}px) scale(.3)`,opacity:0},{transform:`translate(${tx}px,${ty}px) scale(1.1)`,opacity:1,offset:.3},{transform:`translate(${tx}px,${ty-8}px) scale(1)`,opacity:1,offset:.8},{transform:`translate(${tx}px,${ty-20}px) scale(.9)`,opacity:0}],{duration:1600,easing:"ease-out"}).onfinish=()=>b.remove(); },
    () => { const c=center(); for (let i=0;i<3;i++){ const r=document.createElement("div"); r.className="fx-ring"; r.style.borderColor=pick(COLORS); fx.appendChild(r);
            r.animate([{transform:`translate(${c.x-c.w/2}px,${c.y-c.w/2}px) scale(1)`,width:c.w+"px",height:c.w+"px",opacity:.9},{transform:`translate(${c.x-c.w/2}px,${c.y-c.w/2}px) scale(2.6)`,width:c.w+"px",height:c.w+"px",opacity:0}],{duration:1100,delay:i*180,easing:"ease-out",fill:"backwards"}).onfinish=()=>r.remove(); } },
    () => { photo.animate([{transform:"translateY(0) scale(1,1)"},{transform:"translateY(2%) scale(1.03,.96)",offset:.15},{transform:"translateY(-7%) scale(.98,1.03)",offset:.45},{transform:"translateY(0) scale(1.03,.97)",offset:.75},{transform:"translateY(0) scale(1,1)"}],{duration:900,easing:"ease-out"}); bounce([{transform:"translateY(0)"},{transform:"translateY(-12%)",offset:.45},{transform:"translateY(0)"}],{duration:900}); burst("star",8,.8); }
  ];
  let last = -1;
  btn.addEventListener("click", () => {
    let i; do { i = Math.floor(Math.random()*EFFECTS.length); } while (i === last && EFFECTS.length > 1);
    last = i; EFFECTS[i]();
  });
})();

/* protection: no zoom, no copying, no saving images */
(() => {
  const isField = t => t && t.closest && t.closest("input,textarea,[contenteditable]");
  const stop = e => { if (!isField(e.target)) e.preventDefault(); };
  ["copy","cut","contextmenu","dragstart","selectstart"].forEach(ev => document.addEventListener(ev, stop));
  // pinch / gesture zoom (iOS Safari ignores user-scalable=no)
  ["gesturestart","gesturechange","gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
  let lastTap = 0;
  document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTap < 300 && !isField(e.target) && !e.target.closest("button,a")) e.preventDefault(); lastTap = now; }, { passive:false });
  // desktop: ctrl/cmd + wheel, ctrl/cmd + +/-/0, copy/save/print/source shortcuts
  document.addEventListener("wheel", e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive:false });
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (mod && ["+","=","-","_","0"].includes(k)) return e.preventDefault();
    if (mod && ["s","p","u"].includes(k)) return e.preventDefault();
    if (mod && ["c","x","a"].includes(k) && !isField(e.target)) return e.preventDefault();
  });
})();

/* screenshot shield: black screen when the page loses focus or a screenshot combo starts */
(() => {
  const sh = document.getElementById("shield");
  const on = () => { sh.hidden = false; }, off = () => { sh.hidden = true; };
  window.addEventListener("blur", on);
  window.addEventListener("focus", off);
  document.addEventListener("visibilitychange", () => document.hidden ? on() : off());
  window.addEventListener("pagehide", on);
  window.addEventListener("pageshow", off);
  // ⌘⇧3/4/5 (Mac) and Win+Shift+S start with Meta+Shift held → go black before the shot
  const combo = e => e.metaKey && e.shiftKey;
  document.addEventListener("keydown", e => {
    if (combo(e)) on();
    if (e.key === "PrintScreen") { on(); try { navigator.clipboard.writeText(""); } catch(_){} }
  }, true);
  document.addEventListener("keyup", e => {
    if (e.key === "PrintScreen") { try { navigator.clipboard.writeText(""); } catch(_){} setTimeout(() => document.hasFocus() && off(), 1500); return; }
    if (!combo(e) && document.hasFocus()) setTimeout(off, 300);
  }, true);
  ["pointerdown","mousemove","touchstart"].forEach(ev => document.addEventListener(ev, () => { if (!sh.hidden) off(); }, { passive:true }));
})();

/* confetti */
(() => {
  const c = document.querySelector(".confetti"), cols = ["#ff8fb1","#8ec5ff","#ffd66b","#9fe3c9","#c9b6ff"];
  for (let i=0;i<28;i++){
    const p = document.createElement("i");
    p.style.left = Math.random()*100+"vw";
    p.style.background = cols[i%cols.length];
    p.style.animationDuration = 8+Math.random()*10+"s";
    p.style.animationDelay = -Math.random()*18+"s";
    c.appendChild(p);
  }
})();

/* reveal on scroll */
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }), {threshold:.15});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

setLang(lang);
loadGifts();
</script>
